<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CloudStash monochrome dark mark</title>
  <desc id="desc">A layered monochrome dark cloud mark with a folded silver ribbon seam.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="44%" r="50%">
      <stop offset="0" stop-color="#59606B" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#222A34" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudBack" x1="248" y1="236" x2="782" y2="782" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A505B"/>
      <stop offset="0.18" stop-color="#2E3540"/>
      <stop offset="0.55" stop-color="#121821"/>
      <stop offset="1" stop-color="#06090D"/>
    </linearGradient>
    <linearGradient id="cloudFront" x1="220" y1="366" x2="721" y2="846" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#333A45"/>
      <stop offset="0.35" stop-color="#141A22"/>
      <stop offset="1" stop-color="#05080C"/>
    </linearGradient>
    <linearGradient id="rightLobe" x1="609" y1="342" x2="865" y2="714" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A414C"/>
      <stop offset="0.46" stop-color="#171D26"/>
      <stop offset="1" stop-color="#070B10"/>
    </linearGradient>
    <linearGradient id="fold" x1="272" y1="336" x2="774" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F7F9"/>
      <stop offset="0.18" stop-color="#AEB5C0"/>
      <stop offset="0.38" stop-color="#F4F6F8"/>
      <stop offset="0.62" stop-color="#838B96"/>
      <stop offset="0.82" stop-color="#D8DCE2"/>
      <stop offset="1" stop-color="#5A626E"/>
    </linearGradient>
    <linearGradient id="foldShadow" x1="290" y1="384" x2="750" y2="686" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="105" y="158" width="820" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="38" stdDeviation="42" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <filter id="innerGlow" x="130" y="180" width="780" height="690" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="cloudClip">
      <path d="M194 670C117 665 62 607 62 535C62 458 126 396 207 394C225 287 318 205 431 205C534 205 622 273 649 368C677 354 710 346 744 346C846 346 929 426 929 524C929 622 846 702 744 702H246C227 702 209 690 194 670Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="none"/>
  <ellipse cx="514" cy="784" rx="314" ry="76" fill="#000000" opacity="0.36" filter="url(#softShadow)"/>
  <circle cx="512" cy="510" r="470" fill="url(#bgGlow)"/>

  <g filter="url(#innerGlow)">
    <!-- Back cloud mass -->
    <path id="cloud-body-back" d="M194 670C117 665 62 607 62 535C62 458 126 396 207 394C225 287 318 205 431 205C534 205 622 273 649 368C677 354 710 346 744 346C846 346 929 426 929 524C929 622 846 702 744 702H246C227 702 209 690 194 670Z" fill="url(#cloudBack)"/>
    <!-- Right depth lobe -->
    <path id="cloud-body-right-depth" d="M649 368C675 354 708 345 743 346C847 348 929 428 929 525C929 622 846 702 744 702H575C628 634 639 497 649 368Z" fill="url(#rightLobe)" opacity="0.82"/>
    <!-- Front folded storage pocket -->
    <path id="cloud-body-front" d="M85 574C92 493 159 429 243 422H353C424 422 488 463 518 527L622 752C638 786 614 825 576 825H241C154 825 82 760 76 678L75 659C73 627 78 598 85 574Z" fill="url(#cloudFront)"/>
    <!-- Diagonal contour shadow under fold -->
    <path id="fold-cavity-shadow" d="M205 455C302 469 400 518 514 625C581 688 637 715 704 713C643 759 571 759 500 704C393 621 311 530 205 455Z" fill="url(#foldShadow)" opacity="0.64" clip-path="url(#cloudClip)"/>
    <!-- Main metallic fold highlight -->
    <path id="fold-highlight" d="M197 410C317 431 434 491 548 583C628 647 684 650 754 613C724 662 681 695 619 697C561 699 519 670 466 627C359 539 278 458 197 410Z" fill="url(#fold)"/>
    <!-- Thin bright ridge on fold -->
    <path id="fold-ridge" d="M219 421C319 448 416 503 522 589C606 658 666 664 730 630" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="10" stroke-linecap="round"/>
    <!-- Front pocket edge line -->
    <path id="front-edge-highlight" d="M86 574C90 504 150 445 236 438H346C407 438 466 475 494 532" stroke="#737B87" stroke-opacity="0.22" stroke-width="3"/>
    <!-- top subtle edge -->
    <path id="cloud-top-edge" d="M229 392C249 289 332 223 430 223C529 223 612 289 634 383" stroke="#CFD5DE" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
